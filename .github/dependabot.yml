version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/modules/gke-foundation
      - /terraform/environments/dev/10-foundation
      - /terraform/environments/dev/20-platform
      - /terraform/environments/prod/10-foundation
      - /terraform/environments/prod/20-platform
      - /examples/argocd-platform
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
