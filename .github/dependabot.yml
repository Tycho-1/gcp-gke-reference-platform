version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # One lockfile per deploy root (no module path — gke-foundation has no committed lock).
  # Do not group Terraform updates across directories: grouped multi-dir runs can hit
  # InvalidUpdatedDependencies ("Previous version was not provided for hashicorp/google").
  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/environments/dev/10-foundation
      - /terraform/environments/dev/20-platform
      - /terraform/environments/prod/10-foundation
      - /terraform/environments/prod/20-platform
      - /examples/argocd-platform
    schedule:
      interval: weekly
