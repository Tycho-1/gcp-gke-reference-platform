apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-nginx
  labels:
    app.kubernetes.io/name: sample-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
